services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in a .env file or your shell environment before starting}
      CORS_ORIGINS: '["http://localhost:3000"]'
      ENVIRONMENT: production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
